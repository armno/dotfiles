# Use Ctrl+a as prefix instead of Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Show pane titles in the border
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "

# Forward extended keys (CSI-u) so apps see Shift+Enter etc. (needs Ghostty + tmux 3.2+)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse support: scroll panes, click to focus, drag borders to resize
set -g mouse on

# Scrollback buffer (default is 2000 lines)
set -g history-limit 50000

# List all sessions with fzf (prefix+S): select one to attach/switch to
bind-key p display-popup -E "tmux list-sessions -F '#S' 2>/dev/null | fzf --reverse | xargs -I{} tmux switch-client -t '{}'"
bind-key i display-popup -E "~/code/dotfiles/t"

# Open a URL from the pane (prefix+u): -J joins wrapped lines, so long URLs stay intact
bind-key u display-popup -E "tmux capture-pane -p -J -t '#{pane_id}' | grep -oE 'https?://[^ \"]+' | sort -u | fzf --reverse | xargs -I{} open {}"

# Switch windows with Shift+Left/Right (no prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# Switch sessions with Shift+Up/Down (no prefix)
bind -n S-Up switch-client -p
bind -n S-Down switch-client -n

# Status bar at the top, muted colors
set -g status-position top
set -g status 2
set -g status-left-length 20
set -g status-left "[#S]  "
set -g status-right "#{b:pane_current_path} "
set -g status-style "bg=colour237 fg=colour250"
setw -g window-status-current-style "bg=colour243 fg=colour255 bold"
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-separator " "

# Top status line (row 0): list all tmux sessions, highlighting the attached one.
# Two config gotchas, both escaped below:
#   %%s not %s  — tmux runs strftime() over status formats (%s = epoch seconds); %% survives as %s.
#   \$s not $s  — tmux expands $vars at parse time; \$ keeps them for the shell to expand.
set -g status-format[0] "#[align=left]#(CUR='#{session_name}'; tmux list-sessions -F '##{session_name}' 2>/dev/null | while read -r s; do if [ \"\$s\" = \"\$CUR\" ]; then printf '#[fg=colour255,bg=colour243,bold] %%s #[default]  ' \"\$s\"; else printf '#[fg=colour243] %%s #[default]  ' \"\$s\"; fi; done)"

# Main window line moved to row 1 (below the session list). This is tmux's built-in
# default status line template, relocated so the session list sits on top.
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Plugins (managed by tpack)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persist sessions across reboots
set -g @continuum-restore 'on'        # auto-restore when the tmux server starts
set -g @continuum-save-interval '15'  # minutes

run 'tpack init'  # keep as the LAST line
